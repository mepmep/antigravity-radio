<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Radio Waves -->
  <path d="M 60 76 A 40 40 0 0 1 132 76" fill="none" stroke="url(#neonGrad)" stroke-width="5" stroke-linecap="round" opacity="0.4" />
  <path d="M 72 88 A 24 24 0 0 1 120 88" fill="none" stroke="url(#neonGrad)" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  
  <!-- Central Radio Tower / Antenna Core -->
  <circle cx="96" cy="100" r="14" fill="url(#neonGrad)" filter="url(#glow)" />
  <circle cx="96" cy="100" r="7" fill="#ffffff" />
  
  <!-- Stand & Base -->
  <path d="M 96 114 L 96 142" stroke="url(#neonGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 78 142 L 114 142" stroke="url(#neonGrad)" stroke-width="6" stroke-linecap="round" />
  
  <!-- Sound Equalizer Bars (Mini) -->
  <rect x="42" y="128" width="4" height="14" rx="2" fill="#06b6d4" opacity="0.8" />
  <rect x="50" y="120" width="4" height="22" rx="2" fill="#6366f1" opacity="0.8" />
  <rect x="138" y="120" width="4" height="22" rx="2" fill="#6366f1" opacity="0.8" />
  <rect x="146" y="128" width="4" height="14" rx="2" fill="#ec4899" opacity="0.8" />
</svg>
