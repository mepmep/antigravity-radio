<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="neonGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3" />
  
  <!-- Glow backdrop -->
  <circle cx="256" cy="256" r="180" fill="url(#ambientGlow)" />
  
  <!-- Outer Radio Wave 3 -->
  <path d="M 120 190 A 150 150 0 0 1 392 190" fill="none" stroke="url(#neonGrad512)" stroke-width="12" stroke-linecap="round" opacity="0.3" />
  <!-- Outer Radio Wave 2 -->
  <path d="M 152 215 A 110 110 0 0 1 360 215" fill="none" stroke="url(#neonGrad512)" stroke-width="12" stroke-linecap="round" opacity="0.6" />
  <!-- Inner Radio Wave 1 -->
  <path d="M 184 240 A 74 74 0 0 1 328 240" fill="none" stroke="url(#neonGrad512)" stroke-width="12" stroke-linecap="round" opacity="0.9" />
  
  <!-- Central Pulse Sphere -->
  <circle cx="256" cy="270" r="38" fill="url(#neonGrad512)" filter="url(#glow512)" />
  <circle cx="256" cy="270" r="18" fill="#ffffff" />
  
  <!-- Microphone / Antenna Stand -->
  <path d="M 256 308 L 256 385" stroke="url(#neonGrad512)" stroke-width="14" stroke-linecap="round" />
  <path d="M 206 385 L 306 385" stroke="url(#neonGrad512)" stroke-width="14" stroke-linecap="round" />
  
  <!-- Modern Equalizer Bars -->
  <rect x="80" y="340" width="10" height="35" rx="5" fill="#06b6d4" opacity="0.85" />
  <rect x="100" y="315" width="10" height="60" rx="5" fill="#38bdf8" opacity="0.85" />
  <rect x="120" y="295" width="10" height="80" rx="5" fill="#6366f1" opacity="0.85" />
  
  <rect x="382" y="295" width="10" height="80" rx="5" fill="#6366f1" opacity="0.85" />
  <rect x="402" y="315" width="10" height="60" rx="5" fill="#d946ef" opacity="0.85" />
  <rect x="422" y="340" width="10" height="35" rx="5" fill="#ec4899" opacity="0.85" />
</svg>
