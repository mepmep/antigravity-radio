<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <title>MyRadio - Radio en Vivo</title>
  <meta name="description" content="Reproductor de radio en vivo ultraligero y moderno con metadata en tiempo real y temporizador de apagado." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MyRadio" />
  
  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Script Oficial de Widgets Centova / SonicPanel (Metadata en Vivo sin CORS) -->
  <script id='sonic_js' data-port='8084' src='https://az03.streaminghd.net.ar/cp/widgets.js?r=210'></script>

  <!-- Estilos Estáticos Optimizados (Compilados Localmente para PWA Ultraligera) -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-dark-bg text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 relative overflow-x-hidden selection:bg-cyan-500 selection:text-black">

  <!-- Fondo Ambiental Dinámico con Halos de Neón -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div id="ambient-orb-1" class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl transition-all duration-1000"></div>
    <div id="ambient-orb-2" class="absolute top-1/3 -right-32 w-96 h-96 bg-cyan-600/15 rounded-full blur-3xl transition-all duration-1000"></div>
    <div id="ambient-orb-3" class="absolute -bottom-32 left-1/4 w-96 h-96 bg-pink-600/10 rounded-full blur-3xl transition-all duration-1000"></div>
  </div>

  <!-- Banner de Sin Conexión -->
  <div id="offline-banner" class="fixed top-3 z-50 transform -translate-y-20 transition-transform duration-300 bg-amber-500/90 backdrop-blur-md text-slate-950 font-bold px-4 py-2 rounded-full shadow-lg text-xs sm:text-sm flex items-center gap-2 border border-amber-300/40">
    <svg class="w-4 h-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L12 12m6.364-6.364L12 12m-6.364 6.364a9 9 0 010-12.728m0 0l2.829 2.829m-2.829-2.829L12 12m-6.364 6.364L12 12" />
    </svg>
    <span>Sin conexión a internet. Reconectando...</span>
  </div>

  <!-- Contenedor Principal de la App (Player Container) -->
  <main class="w-full max-w-md bg-dark-card/85 backdrop-blur-2xl border border-slate-800/80 rounded-3xl sm:rounded-[2.25rem] shadow-2xl p-5 sm:p-7 relative z-10 flex flex-col justify-between transition-all duration-300 hover:border-slate-700/60">

    <!-- 1. Header: Logo, Insignia y Acciones -->
    <header class="flex items-center justify-between gap-2 pb-4 border-b border-slate-800/60">
      <!-- Marca / Emisora -->
      <div class="flex items-center gap-2.5">
        <img 
          src="logo.png" 
          alt="MyRadio Logo" 
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl object-contain bg-slate-900/80 p-1 border border-slate-700/50 shadow-inner"
          onerror="this.src='favicon.svg'"
        />
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base sm:text-lg font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-300 bg-clip-text text-transparent">
              MyRadio
            </h1>
            <span class="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
              HD
            </span>
          </div>
          <p class="text-[11px] text-slate-400 font-medium leading-none mt-0.5">En vivo por Streaming</p>
        </div>
      </div>

      <!-- Botones de Acción Superiores -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- Botón Instalar PWA (Oculto por defecto hasta evento de instalación) -->
        <button 
          id="pwa-install-btn" 
          type="button"
          class="hidden px-2.5 py-1.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 text-xs font-bold rounded-full items-center gap-1.5 shadow-md shadow-cyan-500/20 transition active:scale-95"
          title="Instalar App en tu pantalla de inicio"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          <span>Instalar</span>
        </button>

        <!-- Botón Sleep Timer -->
        <button 
          id="timer-btn" 
          type="button"
          class="relative p-2 rounded-full bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/50 text-slate-300 hover:text-cyan-300 transition duration-200 active:scale-90"
          title="Temporizador de apagado"
        >
          <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <!-- Badge contador cuando el timer está activo -->
          <span 
            id="timer-badge" 
            class="hidden absolute -top-1.5 -right-1.5 bg-pink-500 text-white font-bold text-[9px] px-1.5 py-0.5 rounded-full shadow-sm animate-pulse"
          >
            <span id="timer-badge-text">15m</span>
          </span>
        </button>

        <!-- Botón Compartir -->
        <button 
          id="share-btn" 
          type="button"
          class="p-2 rounded-full bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/50 text-slate-300 hover:text-cyan-300 transition duration-200 active:scale-90"
          title="Compartir radio"
        >
          <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- 2. Carátula Dinámica del Tema con Iluminación Reactiva -->
    <div class="my-5 sm:my-6 flex flex-col items-center justify-center relative">
      <div class="relative w-56 h-56 sm:w-64 sm:h-64 flex items-center justify-center">
        <!-- Resplandor Difuminado de la Carátula -->
        <div 
          id="artwork-ambient" 
          class="absolute inset-0 bg-cyan-500/25 rounded-3xl blur-2xl transform scale-90 transition-all duration-700 opacity-60"
        ></div>

        <!-- Imagen de Carátula Centrada -->
        <div class="relative w-full h-full rounded-3xl overflow-hidden bg-slate-900 border border-slate-700/80 shadow-2xl z-10 flex items-center justify-center group">
          <img 
            id="artwork-img" 
            src="logo.png" 
            alt="Carátula del tema" 
            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
            onerror="this.src='logo.png'"
          />

          <!-- Elementos Ocultos Receptores del Widget SonicPanel / Centova -->
          <div id="sonic_art_full" class="hidden"></div>
          <div id="sonic_art" class="hidden"></div>
          <span class="cc_streaminfo hidden" data-type="trackimageurl"></span>
          <span class="cc_streaminfo hidden" data-type="image"></span>
          <span class="cc_streaminfo hidden" data-type="cover"></span>

          <!-- Overlay degradado inferior para legibilidad de badges -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/30 pointer-events-none"></div>

          <!-- Insignia Oyentes (Arriba Derecha - Sincronizado con Widget) -->
          <div id="listeners-badge" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-slate-950/80 backdrop-blur-md border border-slate-700/60 text-[11px] font-medium text-slate-300 shadow-lg">
            <svg class="w-3 h-3 text-cyan-400" fill="currentColor" viewBox="0 0 20 20">
              <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z" />
            </svg>
            <span id="sonic_listeners" class="cc_streaminfo" data-type="listeners">1</span>
          </div>

          <!-- Ecualizador Animado en Vivo (Abajo Izquierda de la carátula) -->
          <div id="visualizer-bars" class="absolute bottom-3 left-3 z-20 flex items-end gap-1 h-7 opacity-40 transition-opacity duration-300">
            <span class="w-1 bg-cyan-400 rounded-full h-1.5 transition-all duration-200"></span>
            <span class="w-1 bg-cyan-300 rounded-full h-1.5 transition-all duration-200"></span>
            <span class="w-1 bg-indigo-400 rounded-full h-1.5 transition-all duration-200"></span>
            <span class="w-1 bg-pink-400 rounded-full h-1.5 transition-all duration-200"></span>
            <span class="w-1 bg-cyan-400 rounded-full h-1.5 transition-all duration-200"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Información del Tema (Título y Artista Dinámicos) -->
    <div class="text-center px-2 py-1 mb-4">
      <div 
        id="sonic_title" 
        class="text-lg sm:text-xl font-bold text-white tracking-tight leading-tight line-clamp-2 transition-opacity duration-300 cc_streaminfo" 
        data-type="song"
      >
        Cargando canción...
      </div>
      <div 
        id="track-artist" 
        class="text-sm font-semibold text-cyan-400/95 mt-1 truncate transition-opacity duration-300 cc_streaminfo" 
        data-type="artist"
      >
        MyRadio Online
      </div>
    </div>

    <!-- 4. Controles Principales de Audio -->
    <div class="flex items-center justify-center gap-5 sm:gap-6 my-2">
      <!-- Botón Stop / Desconectar -->
      <button 
        id="stop-btn" 
        type="button"
        class="p-3.5 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 text-slate-400 hover:text-rose-400 transition duration-200 active:scale-95 shadow-md flex items-center justify-center"
        title="Detener y desconectar audio (Ahorrar datos)"
      >
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
          <rect x="5" y="5" width="14" height="14" rx="2.5" />
        </svg>
      </button>

      <!-- Botón Gigante Play / Pause / Loading -->
      <button 
        id="play-btn" 
        type="button"
        class="relative w-20 h-20 sm:w-22 sm:h-22 rounded-full bg-gradient-to-tr from-cyan-500 via-indigo-500 to-pink-500 hover:from-cyan-400 hover:via-indigo-400 hover:to-pink-400 text-white shadow-xl shadow-cyan-500/25 flex items-center justify-center transform transition duration-300 hover:scale-105 active:scale-95 focus:outline-none focus:ring-4 focus:ring-cyan-500/30"
        title="Reproducir / Pausar"
      >
        <!-- Icono Play -->
        <svg id="play-icon" class="w-9 h-9 ml-1 fill-white transition-transform duration-200" viewBox="0 0 24 24">
          <path d="M8 5.14v14l11-7-11-7z" />
        </svg>

        <!-- Icono Pause (Oculto inicialmente) -->
        <svg id="pause-icon" class="hidden w-8 h-8 fill-white transition-transform duration-200" viewBox="0 0 24 24">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
        </svg>

        <!-- Spinner de Carga (Oculto inicialmente) -->
        <svg id="loading-spinner" class="hidden w-9 h-9 animate-spin text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </button>

      <!-- Botón Re-sync / Refrescar Stream -->
      <button 
        id="refresh-btn" 
        type="button"
        class="p-3.5 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 text-slate-400 hover:text-cyan-300 transition duration-200 active:scale-95 shadow-md flex items-center justify-center"
        title="Reconectar audio en vivo"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
    </div>

    <!-- 5. Barra de Control de Volumen -->
    <div class="mt-4 pt-3 border-t border-slate-800/60 flex items-center gap-3 px-1">
      <button 
        id="volume-btn" 
        type="button" 
        class="text-slate-400 hover:text-cyan-300 transition active:scale-90"
        title="Silenciar / Activar sonido"
      >
        <!-- Icono Volumen Normal -->
        <svg id="volume-high-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
        <!-- Icono Mute (Oculto) -->
        <svg id="volume-mute-icon" class="hidden w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
        </svg>
      </button>

      <div class="relative flex-1 flex items-center">
        <input 
          id="volume-slider" 
          type="range" 
          min="0" 
          max="1" 
          step="0.01" 
          value="1" 
          class="w-full h-1.5 bg-slate-700/80 rounded-lg appearance-none cursor-pointer accent-cyan-400 focus:outline-none"
          title="Nivel de volumen"
        />
      </div>

      <span id="volume-percent" class="text-xs font-semibold text-slate-400 w-8 text-right">100%</span>
    </div>

    <!-- Elemento Audio Oculto -->
    <audio id="audio-player" preload="none" crossorigin="anonymous"></audio>
  </main>

  <!-- Footer con Créditos y Estado -->
  <footer class="mt-4 text-center z-10">
    <p class="text-xs text-slate-500 font-medium">
      &copy; <span id="current-year">2026</span> <a href="https://myradio.net.ar" target="_blank" rel="noopener noreferrer" class="hover:text-cyan-400 transition">myradio.net.ar</a> &bull; Todos los derechos reservados
    </p>
  </footer>

  <!-- MODAL: Temporizador de Apagado (Sleep Timer) -->
  <div 
    id="timer-modal" 
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300"
  >
    <div class="w-full max-w-sm bg-dark-card border border-slate-700/80 rounded-3xl p-6 shadow-2xl transform scale-95 transition-transform duration-300 relative">
      <!-- Encabezado Modal -->
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <div class="flex items-center gap-2">
          <div class="p-2 rounded-xl bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <div>
            <h3 class="text-base font-bold text-white">Temporizador de Apagado</h3>
            <p class="text-xs text-slate-400">Apaga la radio y corta datos automáticamente</p>
          </div>
        </div>
        <button id="close-timer-modal" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Estado actual del temporizador -->
      <div id="timer-status-box" class="my-4 p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 text-center">
        <span class="text-xs text-slate-400 block mb-1">Tiempo restante</span>
        <div id="modal-countdown" class="text-3xl font-extrabold font-mono text-cyan-400 tracking-wider">
          --:--
        </div>
      </div>

      <!-- Botones de Presets Rápidos -->
      <div class="grid grid-cols-3 gap-2.5 mb-4">
        <button type="button" data-minutes="15" class="timer-preset-btn py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-cyan-500/20 hover:text-cyan-300 hover:border-cyan-500/40 border border-slate-700 text-slate-200 font-bold text-sm transition active:scale-95">
          15 min
        </button>
        <button type="button" data-minutes="30" class="timer-preset-btn py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-cyan-500/20 hover:text-cyan-300 hover:border-cyan-500/40 border border-slate-700 text-slate-200 font-bold text-sm transition active:scale-95">
          30 min
        </button>
        <button type="button" data-minutes="60" class="timer-preset-btn py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-cyan-500/20 hover:text-cyan-300 hover:border-cyan-500/40 border border-slate-700 text-slate-200 font-bold text-sm transition active:scale-95">
          60 min
        </button>
      </div>

      <!-- Acciones del Modal -->
      <div class="flex items-center gap-2">
        <button 
          id="cancel-timer-btn" 
          type="button" 
          class="flex-1 py-2.5 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/30 text-rose-300 font-bold text-xs sm:text-sm transition active:scale-95"
        >
          Desactivar Temporizador
        </button>
      </div>
    </div>
  </div>

  <!-- Componente Toast de Notificación Flotante -->
  <div 
    id="toast" 
    class="fixed bottom-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 bg-slate-900/95 backdrop-blur-xl border border-slate-700 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs sm:text-sm font-semibold flex items-center gap-2 pointer-events-none"
  >
    <span id="toast-icon">✨</span>
    <span id="toast-message">Mensaje</span>
  </div>

  <!-- Script Principal de la Aplicación -->
  <script src="app.js"></script>
</body>
</html>
